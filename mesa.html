<script>
window.__ac=null;
function vibrar(ms){ try{ if(vibOn && navigator.vibrate) navigator.vibrate(ms||18); }catch(e){} }
function tone(f,dur,type,vol,slideTo){
  try{
    if(localStorage.getItem('67sfx')==='0') return;
    window.__ac = window.__ac || new (window.AudioContext||window.webkitAudioContext)();
    var ac=window.__ac; if(ac.state==='suspended') ac.resume();
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square';
    var d=dur||0.12, v=(vol==null?0.06:vol);
    o.frequency.setValueAtTime(Math.max(40,f||520), ac.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), ac.currentTime+d);
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+d+0.01);
  }catch(e){}
}
function beep(f){ tone(f,0.12,'square',0.06); }
function melodia(notas,gap){
  (notas||[]).forEach(function(n,i){
    setTimeout(function(){ tone(n,0.13,'square',0.055); }, i*(gap||85));
  });
}
</script>

// grade espacial
const GRID=24, GW=Math.ceil(250/GRID), GH=Math.ceil(430/GRID);
const CELLS=new Array(GW*GH);
for(let i=0;i<CELLS.length;i++) CELLS[i]=[];
for(const s of SEGS){
  const x0=Math.min(s[0],s[2]), x1=Math.max(s[0],s[2]);
  const y0=Math.min(s[1],s[3]), y1=Math.max(s[1],s[3]);
  for(let cy=Math.floor(y0/GRID); cy<=Math.floor(y1/GRID); cy++){
    for(let cx=Math.floor(x0/GRID); cx<=Math.floor(x1/GRID); cx++){
      if(cy<0||cx<0||cy>=GH||cx>=GW) continue;
      CELLS[cy*GW+cx].push(s);
    }
  }
}
function nearSegs(x,y,r){
  const out=[];
  const cx0=Math.floor((x-r)/GRID), cx1=Math.floor((x+r)/GRID);
  const cy0=Math.floor((y-r)/GRID), cy1=Math.floor((y+r)/GRID);
  for(let cy=cy0;cy<=cy1;cy++){
    if(cy<0||cy>=GH) continue;
    for(let cx=cx0;cx<=cx1;cx++){
      if(cx<0||cx>=GW) continue;
      for(const s of CELLS[cy*GW+cx]) if(out.indexOf(s)<0) out.push(s);
    }
  }
  return out;
}

function andarTrilho(dt){

  ball.y=TRILHO[i][1]+(TRILHO[i+1][1]-TRILHO[i][1])*u;

// ---------- física ----------
function segCollide(b,x1,y1,x2,y2,rest,omega){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;
  let t=clamp(((b.x-x1)*dx+(b.y-y1)*dy)/l2,0,1);
  const cx=x1+dx*t,cy=y1+dy*t;
  let nx=b.x-cx,ny=b.y-cy,d=Math.hypot(nx,ny);
  const rad=b.r+4;
  if(d>rad)return false;
  if(d<0.001){nx=0;ny=-1;d=1;}
  nx/=d;ny/=d;
  b.x=cx+nx*(rad+0.4);b.y=cy+ny*(rad+0.4);
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;}
  if(omega){const px=cx-x1,py=cy-y1;b.vx+=(-omega*py)*0.62;b.vy+=(omega*px)*0.62;}
  return true;
}


// V cheio: se a bola entrar no triangulo, empurra para cima
const VP1=[[2,384],[96,401],[104,409],[104,430],[2,430]];
const VP2=[[248,384],[137,401],[129,409],[129,430],[248,430]];
function inPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function solidV(){
  for(const poly of [VP1,VP2]){
    if(inPoly(ball.x,ball.y,poly)){
      let y=ball.y;
      while(inPoly(ball.x,y,poly) && y>200) y-=1;
      ball.y=y-ball.r;
      if(ball.vy>0) ball.vy*=-0.25;
      return true;
    }
  }
  return false;
}

let hitSnd=0;
function wallCollide(){
  for(let it=0; it<4; it++){
    let hitAny=false;
    for(const s of nearSegs(ball.x, ball.y, ball.r+2)){
      const x1=s[0],y1=s[1],x2=s[2],y2=s[3];
      const dx=x2-x1, dy=y2-y1;
      const l2=dx*dx+dy*dy || 1;
      let tt=((ball.x-x1)*dx+(ball.y-y1)*dy)/l2;
      tt=tt<0?0:tt>1?1:tt;
      const cx=x1+dx*tt, cy=y1+dy*tt;
      let nx=ball.x-cx, ny=ball.y-cy;
      let d=Math.hypot(nx,ny);
      if(d>=ball.r) continue;
      hitAny=true;
      if(d<0.0001){ nx=0; ny=-1; d=1; }
      nx/=d; ny/=d;
      ball.x += nx*(ball.r-d+0.05);
      ball.y += ny*(ball.r-d+0.05);
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<-70 && performance.now()-hitSnd>110){
        hitSnd=performance.now();
        tone(Math.min(440,300+(-vn)*0.25),0.05,'triangle',0.05);
      }
      if(vn<0){ ball.vx -= 1.45*vn*nx; ball.vy -= 1.45*vn*ny; }
      const tx=-ny, ty=nx;
      const vt=ball.vx*tx+ball.vy*ty;
      ball.vx -= vt*0.02*tx;
      ball.vy -= vt*0.02*ty;
    }
    if(!hitAny) break;
  }
}

function portaoCollide(){
  if(portaoY>0.6) return;
  const x0=177,x1=189,y0=17,y1=46;
  if(ball.x+ball.r>x0 && ball.x-ball.r<x1 && ball.y+ball.r>y0 && ball.y-ball.r<y1){
    const pl=(ball.x+ball.r)-x0, pr=x1-(ball.x-ball.r);
    const pt=(ball.y+ball.r)-y0, pb=y1-(ball.y-ball.r);
    const m=Math.min(pl,pr,pt,pb);
    if(m===pl){ ball.x=x0-ball.r; ball.vx=-Math.abs(ball.vx)*0.5; }
    else if(m===pr){ ball.x=x1+ball.r; ball.vx=Math.abs(ball.vx)*0.5; }
    else if(m===pt){ ball.y=y0-ball.r; ball.vy=-Math.abs(ball.vy)*0.5; }
    else { ball.y=y1+ball.r; ball.vy=Math.abs(ball.vy)*0.5; }
  }
}

function stepPhysics(dt){
  if(!ball.alive)return;
  if(andarTrilho(dt)) return;   // subindo o canal pelo trilho

  // move em passos pequenos (evita atravessar parede)
  const sp0=Math.hypot(ball.vx,ball.vy);
  const steps=Math.min(12,Math.max(1,Math.ceil(sp0*dt/1.2)));
  const sdt=dt/steps;
  for(let s=0;s<steps;s++){
    ball.vy+=GRAV*sdt;
    const sp=Math.hypot(ball.vx,ball.vy);
    const cap = launchBoost>0 ? 820 : MAXV;
    if(sp>cap){ball.vx=ball.vx/sp*cap;ball.vy=ball.vy/sp*cap;}
    if(launchBoost>0) launchBoost-=sdt;
    ball.x+=ball.vx*sdt;
    ball.y+=ball.vy*sdt;
    portaoCollide();
    if(ball.y<minY)minY=ball.y;
    wallCollide();
    solidV();
    if(ball.y>376 && Math.hypot(ball.vx,ball.vy)<70){ ball.vx += (116-ball.x)*3.2*dt; ball.vy += 30*dt; }
  }

  for(const b of bumpers){
    const dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<b.r+ball.r){
      const nx=dx/d,ny=dy/d;
      ball.x=b.x+nx*(b.r+ball.r+0.5);ball.y=b.y+ny*(b.r+ball.r+0.5);
      const vn=ball.vx*nx+ball.vy*ny;
      ball.vx-=1.7*vn*nx;ball.vy-=1.7*vn*ny;
      ball.vx+=nx*95;ball.vy+=ny*95;
      if(b.cool<=0){b.cool=0.08;tone(500+(bumpers.indexOf(b)%3)*55,0.09,'square',0.065);score(100*multN);flash(b.x,b.y-16,'+'+(100*multN),C.Y);}
    }
    b.cool-=dt;
  }

  for(const d of drops){
    if(d.down)continue;
    if(ball.x+ball.r>d.x&&ball.x-ball.r<d.x+DROP_W&&ball.y+ball.r>DROP_Y&&ball.y-ball.r<DROP_Y+DROP_H){
      d.down=true;tone(780,0.07,'square',0.06);score(250*multN);flash(d.x+DROP_W/2,DROP_Y-10,'+'+(250*multN),C.C);
      ball.vy=Math.abs(ball.vy)*0.55+70;ball.y=DROP_Y-ball.r-0.5;
      if(drops.every(k=>k.down)){
        melodia([990,1240,1480],70);score(5000);multN=Math.min(5,multN+1);dropTimer=3;
        flash(125,215,'+5000',C.R);flash(125,202,'x'+multN,C.G);
      }
    }
  }
  if(dropTimer>0){dropTimer-=dt;if(dropTimer<=0)drops.forEach(d=>d.down=false);}


  if(ball.x+ball.r>spin.x&&ball.x-ball.r<spin.x+spin.w&&ball.y+ball.r>spin.y&&ball.y-ball.r<spin.y+spin.h){
    spin.ang+=0.7;tone(880,0.045,'square',0.05);score(25*multN);
    ball.vy=-Math.abs(ball.vy)*0.45-45;ball.y=spin.y-ball.r-0.5;
  }
  spin.ang*=0.93;

  for(const s of slings){
    if(segCollide(ball,s.x2,s.y2,s.x1,s.y1,1.9)){tone(640,0.07,'square',0.06);score(50*multN);}
    segCollide(ball,s.x3,s.y3,s.x1,s.y1,1.15);
    segCollide(ball,s.x2,s.y2,s.x3,s.y3,1.15);
  }

  window.__pad=9;
  var heldNow=flippers.some(f=>f.held||f.pad);
  if(heldNow && !window.__flipHeld && performance.now()-(window.__flipT||0)>60){ window.__flipT=performance.now(); tone(flippers[0].held?450:495,0.07,'square',0.055); }
  window.__flipHeld=heldNow;
  for(const f of flippers){
    const ang=f.right?(Math.PI-f.cur):f.cur;
    const tx=f.px+Math.cos(ang)*f.len,ty=f.py+Math.sin(ang)*f.len;
    const omega=(f.cur-f.prev)/Math.max(dt,1/240);
    segCollide(ball,f.px,f.py,tx,ty,0.85,omega);
  }
  window.__pad=5;

    // portao de mao unica: impede que a bola caia dentro do canal
  if(ball.vy>0&&ball.x>223&&ball.x<246&&ball.y>96&&ball.y<122){ ball.y=96-ball.r; ball.vy=-Math.abs(ball.vy)*0.55-60; }

  const dA=Math.hypot(ball.x-213.5,ball.y-138),dB=Math.hypot(ball.x-22,ball.y-330);
  if(dA<9&&state==='play'&&portalCool<=0){ball.x=20;ball.y=356;portalCool=0.6;tone(600,0.22,'square',0.06,1250);flash(60,340,'PORTAL',C.G);}
  else if(dB<9&&state==='play'&&portalCool<=0){ball.x=206;ball.y=146;portalCool=0.6;tone(600,0.22,'square',0.06,1250);flash(190,150,'PORTAL',C.G);}
  portalCool-=dt;

  if(ball.y>H+8||ball.x<-10||ball.x>W+10){
    vibrar(70);tone(300,0.34,'sawtooth',0.07,80);ball.alive=false;ballNum++;
    if(ballNum>MAXBALL){state='over';saveAura();melodia([392,311,233],130);}else resetBall();
  }

  if(state==='play'&&ball.alive){
    const sp2=Math.hypot(ball.vx,ball.vy);
    if(sp2<28) stuck+=dt; else stuck=0;
    if(ball.y<130 && sp2<70) topStuck+=dt; else topStuck=0;
    if(stuck>1.5){
      const a=Math.random()*Math.PI*2;
      ball.vx+=Math.cos(a)*120; ball.vy+=Math.sin(a)*120-40; stuck=0;
    }
    if(topStuck>1.4){
      // devolve a bola para o meio do campo
      ball.x=125; ball.y=210; ball.vx=(Math.random()-0.5)*90; ball.vy=90;
      topStuck=0;
    }
  }
}

// ---------- auditoria automatica (?audit=1) ----------
function runAudit(){
  const rep={minX:999,maxX:-999,minY:999,maxY:-999,stuck:0,frames:0,drains:0,nan:0,framesAlive:0,spots:{}};
  newGame();
  const dt=1/120;
  for(let i=0;i<120*90;i++){
    if(state==='ready') launch();
    // solta as palhetas: mede se a bola morre sozinha no dreno
    const hold = (i%600)<40;
    flippers[0].held=hold; flippers[1].held=hold;
    for(const f of flippers){
      f.prev=f.cur;
      const target=f.held?f.flip:f.rest;
      f.cur+=clamp(target-f.cur,-0.9,0.9)*0.34;
    }
    const before=ball.alive;
    stepPhysics(dt);
    if(before && !ball.alive) rep.drains++;
    if(ball.alive){
      rep.framesAlive++;
      if(!isFinite(ball.x)||!isFinite(ball.y)) rep.nan++;
      rep.minX=Math.min(rep.minX,ball.x); rep.maxX=Math.max(rep.maxX,ball.x);
      rep.minY=Math.min(rep.minY,ball.y); rep.maxY=Math.max(rep.maxY,ball.y);
      if(Math.hypot(ball.vx,ball.vy)<12){
        rep.stuck++;
        const k=Math.round(ball.x/10)*10+','+Math.round(ball.y/10)*10;
        rep.spots[k]=(rep.spots[k]||0)+1;
      }
    }
    rep.frames++;
    if(state==='over') { rep.over=true; newGame(); }
  }
  rep.stuckPct=Math.round(100*rep.stuck/Math.max(1,rep.framesAlive));
  return rep;
}
function drawAudit(rep){
  R(0,0,W,H,'#1a1030');
  txt('AUDITORIA',125,30,'#ffd52e',12,'center');
  const L=[
    'frames: '+rep.frames,
    'vivas: '+rep.framesAlive,
    'drenos: '+rep.drains,
    'stuck %: '+rep.stuckPct,
    'x: '+rep.minX.toFixed(0)+' .. '+rep.maxX.toFixed(0),
    'y: '+rep.minY.toFixed(0)+' .. '+rep.maxY.toFixed(0),
    'nan: '+rep.nan
  ];
  L.forEach((s,i)=>txt(s,40,80+i*26,'#fff7e6',8));
  const top=Object.entries(rep.spots).sort((a,b)=>b[1]-a[1]).slice(0,3);
  top.forEach((s,i)=>txt((i+1)+') '+s[0]+'  x'+s[1],40,240+i*22,'#6fe3ff',7));
  const ok = rep.nan===0 && rep.minX>6 && rep.maxX<244 && rep.minY>18 && rep.maxY<445 && rep.stuckPct<12 && rep.drains>0;
  txt(ok?'PASSOU':'FALHOU',125,300,ok?'#37d67a':'#ff2d4f',14,'center');
}

const EDIT = location.search.indexOf('edit')>=0;
let drag=null, hoverH=null, sel=null, mouse={x:125,y:200};
let showWalls=false, showV=false, showRad=false, snapOn=false;
let dragSeg=null, dragV=null;
const UNDO=[];
function snapState(){
  UNDO.push(JSON.stringify({
    b:bumpers.map(o=>({x:o.x,y:o.y,r:o.r,col:o.col})),
    d:drops.map(o=>({x:o.x,l:o.l,down:o.down})),
    s:{x:spin.x,y:spin.y,w:spin.w,h:spin.h},
    f:flippers.map(o=>({px:o.px,py:o.py,len:o.len})),
    g:SEGS.map(s=>s.slice()),
    v:[VP1.map(p=>p.slice()),VP2.map(p=>p.slice())]
  }));
  if(UNDO.length>40) UNDO.shift();
}
function undo(){
  const raw=UNDO.pop(); if(!raw) return;
  const st=JSON.parse(raw);
  st.b.forEach((o,i)=>{ if(bumpers[i]){bumpers[i].x=o.x;bumpers[i].y=o.y;bumpers[i].r=o.r;} });
  st.d.forEach((o,i)=>{ if(drops[i]){drops[i].x=o.x;} });
  spin.x=st.s.x; spin.y=st.s.y; spin.w=st.s.w; spin.h=st.s.h;
  st.f.forEach((o,i)=>{ if(flippers[i]){flippers[i].px=o.px;flippers[i].py=o.py;flippers[i].len=o.len;} });
  SEGS.length=0; st.g.forEach(s=>SEGS.push(s));
  for(let i=0;i<st.v[0].length;i++){ VP1[i][0]=st.v[0][i][0]; VP1[i][1]=st.v[0][i][1]; }
  for(let i=0;i<st.v[1].length;i++){ VP2[i][0]=st.v[1][i][0]; VP2[i][1]=st.v[1][i][1]; }
  drawEditor();
}
function grow(k,d){
  const i=parseInt(k.replace(/\D/g,''),10);
  if(k.startsWith('bumper')) bumpers[i].r=Math.max(6,bumpers[i].r+d);
  else if(k==='spin'){ spin.w=Math.max(10,spin.w+d*2); spin.h=Math.max(4,spin.h+ (d>0?1:0)); }
  else if(k.startsWith('flip')) flippers[i].len=Math.max(20,flippers[i].len+d*2);
}

function handles(){
  const hs=[];
  bumpers.forEach((b,i)=>hs.push({k:'bumper'+i,x:b.x,y:b.y}));
  drops.forEach((d,i)=>hs.push({k:'drop'+i,x:d.x+DROP_W/2,y:DROP_Y+DROP_H/2}));
  hs.push({k:'spin',x:spin.x+spin.w/2,y:spin.y+spin.h/2});
  flippers.forEach((f,i)=>hs.push({k:'flip'+i,x:f.px,y:f.py}));
  hs.push({k:'ball',x:234,y:314});
  return hs;
}
function drawEditor(){
  // mesa de fundo
  R(0,0,W,H,'#120a24');
  if(IMG.walls) c.drawImage(IMG.walls,0,0,W,H);
  // grade de alinhamento
  c.strokeStyle='rgba(111,227,255,0.18)';c.lineWidth=1;
  for(let x=0;x<=W;x+=10){c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,H);c.stroke();}
  for(let y=0;y<=H;y+=10){c.beginPath();c.moveTo(0,y+.5);c.lineTo(W,y+.5);c.stroke();}
  // fisica das paredes
  c.strokeStyle='#37d67a';c.lineWidth=1;
  for(const s of SEGS){c.beginPath();c.moveTo(s[0],s[1]);c.lineTo(s[2],s[3]);c.stroke();}
  // V
  c.strokeStyle='#ff2d4f';
  for(const poly of [VP1,VP2]){c.beginPath();c.moveTo(poly[0][0],poly[0][1]);
    for(let i=1;i<poly.length;i++)c.lineTo(poly[i][0],poly[i][1]);c.closePath();c.stroke();}
  // objetos
  for(const b of bumpers){ring(b.x,b.y,b.r,'#ffd52e',1);}
  for(const d of drops){c.strokeStyle='#ffd52e';c.strokeRect(d.x,DROP_Y,DROP_W,DROP_H);}
  c.strokeRect(spin.x,spin.y,spin.w,spin.h);
  for(const f of flippers){
    const ang=f.right?(Math.PI-f.cur):f.cur;
    c.strokeStyle='#6fe3ff';c.beginPath();c.moveTo(f.px,f.py);
    c.lineTo(f.px+Math.cos(ang)*f.len, f.py+Math.sin(ang)*f.len);c.stroke();
  }
  // handles
  for(const h of handles()){
    const on = (hoverH===h.k||drag===h.k||sel===h.k);
    disc(h.x,h.y,on?4:3,on?'#fff7e6':'#6fe3ff');
  }
  // reguas
  c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=1;
  for(let x=0;x<=W;x+=10){const h=(x%50===0)?6:3;c.beginPath();c.moveTo(x+.5,20);c.lineTo(x+.5,20+h);c.stroke();}
  for(let y=20;y<=H;y+=10){const h=(y%50===0)?6:3;c.beginPath();c.moveTo(0,y+.5);c.lineTo(h,y+.5);c.stroke();}
  if(showWalls){
    for(let i=0;i<SEGS.length;i++){

  if(hh){
    txt(hh.k+'  '+Math.round(hh.x)+','+Math.round(hh.y),6,24,'#37d67a',6);
  }
  txt('W parede  V triangulo  R raio  S snap10  Del  +/-  A',6,394,'#9a94a8',5);
  txt('setas 1px / shift 10px',6,404,'#9a94a8',5);
  txt(showWalls?'PAREDES ON':(showV?'TRIANGULO ON':(showRad?'RAIOS ON':(snapOn?'SNAP ON':'editor'))),6,414,'#ffd52e',5);
}
function pickSeg(x,y){
  for(let i=0;i<SEGS.length;i++){
    const s=SEGS[i];
    const mx=(s[0]+s[2])/2, my=(s[1]+s[3])/2;
    if(Math.hypot(mx-x,my-y)<7) return i;
  }
  return null;
}
function pickV(x,y){
  for(let pi=0;pi<2;pi++){
    const poly=pi?VP2:VP1;
    for(let i=0;i<poly.length;i++){
      if(Math.hypot(poly[i][0]-x,poly[i][1]-y)<7) return [pi,i];
    }
  }
  return null;
}
function pickHandle(x,y){
  let best=null,bd=14;
  for(const h of handles()){
    const d=Math.hypot(h.x-x,h.y-y);
    if(d<bd){bd=d;best=h.k;}
  }
  return best;
}
function snapv(v){ return snapOn?Math.round(v/10)*10:v; }
function moveHandle(k,x,y){
  x=snapv(x); y=snapv(y);
  const i=parseInt(k.replace(/\D/g,''),10);
  if(k.startsWith('bumper')){bumpers[i].x=x;bumpers[i].y=y;}
  else if(k.startsWith('drop')){drops[i].x=x-DROP_W/2;drops[i].y=y-DROP_H/2;}
  else if(k==='spin'){spin.x=x-spin.w/2;spin.y=y-spin.h/2;}
  else if(k.startsWith('flip')){flippers[i].px=x;flippers[i].py=y;}
}
function editorEvents(){
  const cv=document.getElementById('c');
  const pos=e=>{const r=cv.getBoundingClientRect();
    return {x:((e.clientX-r.left)/r.width)*W, y:((e.clientY-r.top)/r.height)*H};};
  cv.addEventListener('pointerdown',e=>{
    const p=pos(e); mouse=p; snapState();
    dragSeg=null; dragV=null;
    if(showWalls){ const s=pickSeg(p.x,p.y); if(s!==null){dragSeg=s; sel='seg'+s;} }
    if(!dragSeg && showV){ const v=pickV(p.x,p.y); if(v){dragV=v; sel='v';} }
    if(!dragSeg && !dragV){ drag=pickHandle(p.x,p.y); sel=drag; }
    if(drag){ moveHandle(drag,p.x,p.y); }
    drawEditor();
  });
  cv.addEventListener('pointermove',e=>{
    const p=pos(e); mouse=p;
    if(drag){ moveHandle(drag,p.x,p.y); }
    else if(dragSeg!==null){
      const s=SEGS[dragSeg], dx=p.x-mouse.x, dy=p.y-mouse.y;
      s[0]+=dx;s[1]+=dy;s[2]+=dx;s[3]+=dy;
    }
    else if(dragV){
      const [pi,i]=dragV, poly=pi?VP2:VP1;
      poly[i][0]=snapv(p.x); poly[i][1]=snapv(p.y);
    }
    else hoverH=pickHandle(p.x,p.y);
    drawEditor();
  });
  cv.addEventListener('pointerup',()=>{drag=null;dragSeg=null;dragV=null;});
  addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey) && (e.key==='z'||e.key==='Z')){ undo(); e.preventDefault(); return; }
    if(e.key==='w'||e.key==='W'){ showWalls=!showWalls; drawEditor(); return; }
    if(e.key==='v'||e.key==='V'){ showV=!showV; drawEditor(); return; }
    if(e.key==='r'||e.key==='R'){ showRad=!showRad; drawEditor(); return; }
    if(e.key==='s'||e.key==='S'){ snapOn=!snapOn; drawEditor(); return; }
    // deletar
    if((e.key==='Delete'||e.key==='Backspace') && sel && String(sel).startsWith('seg')){
      const i=parseInt(String(sel).slice(3),10);
      SEGS.splice(i,1); sel=null; drawEditor(); e.preventDefault(); return;
    }
    if((e.key==='Delete'||e.key==='Backspace') && sel){
      const i=parseInt(sel.replace(/\D/g,''),10);
      if(sel.startsWith('bumper')) bumpers.splice(i,1);
      else if(sel.startsWith('drop')) drops.splice(i,1);
      else if(sel==='spin'){ spin.w=0; spin.h=0; }
      sel=null; drag=null; drawEditor(); e.preventDefault(); return;
    }
    // tamanho
    if((e.key==='+'||e.key==='=') && sel){ grow(sel,1); drawEditor(); e.preventDefault(); return; }
    if((e.key==='-'||e.key==='_') && sel){ grow(sel,-1); drawEditor(); e.preventDefault(); return; }
    // adicionar bumper no mouse
    if(e.key==='a'||e.key==='A'){
      bumpers.push({x:Math.round(mouse.x),y:Math.round(mouse.y),r:14,col:C.P,cool:0});
      drawEditor(); e.preventDefault(); return;
    }
    if(!drag) return;
    const st=e.shiftKey?10:1;
    const h=handles().find(q=>q.k===drag); if(!h) return;
    let x=h.x,y=h.y;
    if(e.key==='ArrowLeft')x-=st; if(e.key==='ArrowRight')x+=st;
    if(e.key==='ArrowUp')y-=st;   if(e.key==='ArrowDown')y+=st;
    if(x!==h.x||y!==h.y){ moveHandle(drag,x,y); drawEditor(); e.preventDefault(); }
  });
}

// ---------- input ----------
document.getElementById('c').addEventListener('pointerdown',e=>{
  try{ window.focus(); }catch(err){}
  const rb=document.getElementById('c').getBoundingClientRect();
  const px=((e.clientX-rb.left)/rb.width)*W, py=((e.clientY-rb.top)/rb.height)*H;
  if(paused){
    if(config){
      if(py>140&&py<166){ if(px>156&&px<208){
        som=!som;
        localStorage.setItem('67mute', som?'0':'1');
        try{ if(window.parent&&window.parent.setVol) window.parent.setVol(volMus); }catch(e){}
        try{ beep(700); }catch(e){}
      } return; }
      if(py>180&&py<206){ if(px>156&&px<208){ efxOn=!efxOn; localStorage.setItem('67sfx',efxOn?'1':'0'); } return; }
      if(py>218&&py<248){ if(px>156&&px<208){ vibOn=!vibOn; localStorage.setItem('67vib',vibOn?'1':'0'); if(vibOn) vibrar(30); } return; }
      if(py>250&&py<274&&px>92&&px<220){
        volMus=Math.max(0,Math.min(1,(px-96)/120));
        localStorage.setItem('67vol',String(volMus));
        try{ if(window.parent&&window.parent.setVol) window.parent.setVol(volMus); }catch(e){}
        return;
      }
      if(py>278&&py<320){ config=false; return; }
      return;
    }
    if(py>136&&py<178){ paused=false; return; }
    if(py>180&&py<222){ config=true; return; }
    if(py>224&&py<266){ paused=false; newGame(); return; }
    if(py>268&&py<310){ if(window.parent&&window.parent.go){window.parent.go('menu')}else{location.href='menu.html'}; return; }
    return;
  }
  if(px>226&&py<18){ paused=true; return; }
  if(state==='over'){
    if(py>200&&py<238){ newGame(); return; }
    if(py>238&&py<280){ if(window.parent&&window.parent.go){window.parent.go('menu')}else{location.href='menu.html'}; return; }
    return;
  }
  if(state==='ready'){launch();return;}
  const r=document.getElementById('c').getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*W;
  if(x<W/2)flippers[0].held=true;else flippers[1].held=true;
  vibrar(12);
});
addEventListener('pointerup',()=>{flippers[0].held=false;flippers[1].held=false;});

// botoes 6 e 7 para o celular
if(('ontouchstart' in window)||navigator.maxTouchPoints>0) document.body.classList.add('touch');
(function(){
  function ligar(el,idx){
    if(!el) return;
    function on(e){ e.preventDefault(); flippers[idx].held=true; vibrar(16); }
    function off(e){ e.preventDefault(); flippers[idx].held=false; }
    el.addEventListener('pointerdown',on);
    el.addEventListener('pointerup',off);
    el.addEventListener('pointercancel',off);
    el.addEventListener('pointerleave',off);
  }
  ligar(document.getElementById('pad6'),0);
  ligar(document.getElementById('pad7'),1);
})();
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')flippers[0].held=true;
  if(e.key==='ArrowRight'||e.key==='d')flippers[1].held=true;
  if(e.key===' '||e.key==='ArrowDown'){if(state==='ready')launch();else if(state==='over')newGame();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')flippers[0].held=false;
  if(e.key==='ArrowRight'||e.key==='d')flippers[1].held=false;
});

addEventListener('message',function(e){
  if(e.data==='67newgame'){ paused=false; config=false; newGame(); }
});

// ---------- loop ----------
let last=0,acc=0;
function frame(t){
  if(!last)last=t;
  let dt=(t-last)/1000;last=t;
  if(dt>0.05)dt=0.05;
  acc+=dt;
  const fixed=1/120;
  while(!paused && acc>=fixed){
    for(const f of flippers){
      f.prev=f.cur;
      const target=(f.held||f.pad)?f.flip:f.rest;
      f.cur+=clamp(target-f.cur,-0.9,0.9)*0.34;
    }
    stepPhysics(fixed);
    acc-=fixed;
    if(AUTO&&ball.alive){trail.push([ball.x,ball.y]);if(trail.length>900)trail.shift();}
  }
  draw();
  requestAnimationFrame(frame);
}


/* ---------- controle (gamepad) ----------
   LB/RB (4/5) ou LT/RT (6/7) ou setas do direcional = maos
   A (0) = lancar / tentar de novo    START (9) = pausa    B (1) = menu no fim */
let padPrev={0:false,1:false,9:false}, padL=false, padR=false;
function pollPad(){
  const gps = (navigator.getGamepads && navigator.getGamepads()) || [];
  let gp=null;
  for(const p of gps){ if(p && p.connected){ gp=p; break; } }
  if(gp){
    const btn=function(i){ const b=gp.buttons[i]; return !!(b && (b.pressed || b.value>0.5)); };
    const L = btn(4)||btn(6)||btn(14);
    const R = btn(5)||btn(7)||btn(15);
    flippers[0].pad=L; flippers[1].pad=R;
    if((L && !padL) || (R && !padR)) vibrar(12);
    padL=L; padR=R;

    if(btn(0) && !padPrev[0]){
      if(!paused && state==='ready') launch();
      else if(!paused && state==='over') newGame();
    }
    if(btn(9) && !padPrev[9]){ paused=!paused; if(!paused) config=false; }
    if(btn(1) && !padPrev[1] && state==='over'){
      if(window.parent&&window.parent.go) window.parent.go('menu');
      else location.href='menu.html';
    }
    padPrev[0]=btn(0); padPrev[1]=btn(1); padPrev[9]=btn(9);
  } else {
    flippers[0].pad=false; flippers[1].pad=false;
  }
  requestAnimationFrame(pollPad);
}
requestAnimationFrame(pollPad);

(async function(){
  try{IMG.walls=await load(WALLS_SRC);}catch(e){}
  try{
    const cv2=document.createElement('canvas');cv2.width=W;cv2.height=H;
    const g2=cv2.getContext('2d');
    g2.drawImage(IMG.walls,0,0,W,H);
    g2.globalCompositeOperation='source-in';
    g2.fillStyle='#04060c';g2.fillRect(0,0,W,H);
    IMG.wallSh=cv2;
  }catch(e){}
  try{IMG.handL=await load(HANDL_SRC);}catch(e){}
  if(document.fonts&&FONT_SRC){
    const f=new FontFace('PS2P','url('+FONT_SRC+')');
    f.load().then(()=>document.fonts.add(f)).catch(()=>{});
  }
  newGame();
  if(EDIT){ drawEditor(); editorEvents(); return; }
  if(location.search.indexOf('audit')>=0){ drawAudit(runAudit()); return; }
  if(location.search.indexOf('pause')>=0) paused=true;
  if(AUTO){launch();for(let i=0;i<1500;i++){trail.push([ball.x,ball.y]);stepPhysics(1/120);}}
  requestAnimationFrame(frame);
})();
